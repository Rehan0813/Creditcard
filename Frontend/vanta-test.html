<!DOCTYPE html>
<html>

<head>
    <title>Vanta Test</title>
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        #vanta-bg {
            width: 100%;
            height: 100vh;
        }
    </style>
</head>

<body>
    <div id="vanta-bg"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.dots.min.js"></script>
    <script>
        window.addEventListener('load', function () {
            VANTA.DOTS({
                el: "#vanta-bg",
                mouseControls: true,
                touchControls: true,
                gyroControls: false,
                minHeight: 200.00,
                minWidth: 200.00,
                scale: 1.00,
                scaleMobile: 1.00,
                backgroundColor: 0x222222,
                color: 0xff8820,
                color2: 0xff8820,
                size: 3,
                spacing: 35,
                showLines: true
            });
        });
    </script>
</body>

</html>
